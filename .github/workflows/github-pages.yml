name: GitHub Pages

on:
  push:
    branches:
      - main
      - dev
      - master
  workflow_dispatch:
    inputs:
      base_path:
        description: 'Динамическое программирование.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install --only-binary=:all: poetry==2.4.1

      - name: Install dependencies
        run: make install

      - name: Resolve Pages base path
        id: base
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.base_path }}" ]; then
            echo "path=${{ github.event.inputs.base_path }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Export static site
        env:
          DSA_BASE_PATH: ${{ steps.base.outputs.path }}
        run: poetry run python -m dsa_lab.export_static --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
